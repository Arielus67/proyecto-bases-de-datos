<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" role="img" aria-label="La Cuchara de Luisón · Restaurante">
  <!-- Logo completo: emblema + nombre. Fondo transparente.
       Tipografía: Cormorant Garamond (si no está instalada, cae a Georgia). -->
  <defs>
    <style>
      .serif { font-family: 'Cormorant Garamond', 'Cormorant', Georgia, 'Times New Roman', serif; }
      .sans  { font-family: 'DM Sans', 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Emblema -->
  <g transform="translate(150 6)">
    <circle cx="50" cy="50" r="48.3" fill="#234C3B"/>
    <circle cx="50" cy="50" r="43.3" fill="none" stroke="#C5A56A" stroke-width="1.4"/>
    <g transform="scale(0.8333) translate(60 62) scale(1.15) translate(-60 -62)">
      <g fill="#F7F2E8">
        <circle cx="49.5" cy="33" r="8.5"/>
        <circle cx="60" cy="28" r="10"/>
        <circle cx="70.5" cy="33" r="8.5"/>
        <rect x="48" y="31" width="24" height="9"/>
        <rect x="47" y="39.5" width="26" height="5.5" rx="1.6"/>
      </g>
      <line x1="54" y1="39.5" x2="54" y2="34" stroke="#234C3B" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="60" y1="39.5" x2="60" y2="32.5" stroke="#234C3B" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="66" y1="39.5" x2="66" y2="34" stroke="#234C3B" stroke-width="1.4" stroke-linecap="round"/>
      <g fill="#F7F2E8">
        <ellipse cx="60" cy="61" rx="11.5" ry="14"/>
        <path d="M57.6 73 L62.4 73 L61.8 95 Q61.8 97.5 60 97.5 Q58.2 97.5 58.2 95 Z"/>
        <ellipse cx="60" cy="98" rx="3.6" ry="4.4"/>
      </g>
      <path d="M54.5 55 Q56 50.5 60.5 49.5" fill="none" stroke="#234C3B" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
      <path d="M62.2 89 C66 82.5 72.5 78.5 80.5 78 C79.5 86 73 90.5 62.2 89 Z" fill="#C5A56A"/>
      <path d="M63.5 88.2 C68 85.5 72.5 83 77 80.4" fill="none" stroke="#234C3B" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>

  <!-- Nombre -->
  <text x="200" y="158" text-anchor="middle" class="serif" font-size="27" font-weight="600" letter-spacing="3" fill="#4B3328">LA CUCHARA DE</text>
  <text x="200" y="240" text-anchor="middle" class="serif" font-size="86" font-style="italic" font-weight="600" fill="#234C3B">Luisón</text>

  <!-- Línea dorada y RESTAURANTE -->
  <line x1="48" y1="280" x2="92" y2="280" stroke="#C5A56A" stroke-width="1.5"/>
  <line x1="314" y1="280" x2="358" y2="280" stroke="#C5A56A" stroke-width="1.5"/>
  <text x="203" y="285" text-anchor="middle" class="sans" font-size="13" font-weight="600" letter-spacing="6.5" fill="#C5A56A">RESTAURANTE</text>
</svg>
